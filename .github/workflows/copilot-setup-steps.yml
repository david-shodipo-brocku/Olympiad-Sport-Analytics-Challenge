name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            # Copilot needs to be able to read the repository contents to set up the environment.
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Python dependencies
              run: |
                  pip install --upgrade pip
                  pip install \
                    "numpy>=1.24,<2" \
                    "pandas>=2.0,<3" \
                    "matplotlib>=3.7,<4" \
                    "seaborn>=0.12,<1" \
                    "scikit-learn>=1.3,<2" \
                    "jupyter>=1.0,<2" \
                    "nbformat>=5.9,<6"
                  # xgboost is optional: the notebook handles ImportError gracefully
                  pip install "xgboost>=2.0,<3" || true
